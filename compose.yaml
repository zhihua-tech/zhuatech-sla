# 上海如静知华信息科技有限公司 https://www.zhuatech.cn/
name: zhuatech-sla
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zhuatech_sla
      MYSQL_USER: zhuatech
      MYSQL_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请配置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL","MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zhuatech_sla?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DB_USER: zhuatech
      DB_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请配置 ADMIN_PASSWORD}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:?请配置 REVIEWER_PASSWORD}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?请配置 OPERATOR_PASSWORD}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:?请配置 VIEWER_PASSWORD}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if command -v nc >/dev/null 2>&1; then nc -z 127.0.0.1 8080; else bash -c '</dev/tcp/127.0.0.1/8080'; fi"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:
