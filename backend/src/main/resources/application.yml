# 上海如静知华信息科技有限公司 https://www.zhuatech.cn/
server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhuatech_sla?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:zhuatech}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  flyway:
    enabled: true
app:
  demo: ${DEMO_MODE:false}
  admin-password: ${ADMIN_PASSWORD}
  reviewer-password: ${REVIEWER_PASSWORD}
  operator-password: ${OPERATOR_PASSWORD}
  viewer-password: ${VIEWER_PASSWORD}
